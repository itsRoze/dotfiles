onboarding = false
# herdr — https://herdr.dev

# Everforest Dark Soft, shared with Ghostty, SketchyBar, and JankyBorders.
[theme]
name = "terminal"

[theme.custom]
panel_bg = "reset"
active_row_bg = "#3b432a"
selection_bg = "#4f5b58"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"

[ui]
accent = "#5b4058"
status_indicators = "symbols"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#7fbbb3", bold = true }, "git_status"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["agent", { token = "$claude_usage", fg = "#dbbc7f" }],
]

#
# The prefix is already ctrl+b, the same as tmux, so only the detach key differs:
# herdr ships it as prefix+q. Remapped to prefix+d for tmux muscle memory.
#
# Note prefix+shift+d is close_workspace, so a stray capital here closes a
# workspace rather than detaching.
[keys]
detach = "prefix+d"
